name: Deploy to Lolipop via SSH

on:
  push:
    branches:
      - main
    paths:
      - 'tools/dev/**'
      - '.github/workflows/deploy-ks-editor.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PASS: ${{ secrets.SSH_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sshpass + rsync
        run: |
          timeout 5m sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends sshpass rsync

      - name: Deploy
        run: |
          set -euo pipefail

          for required in SSH_HOST SSH_USER SSH_PASS; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Repository secret ${required} is not configured"
              exit 1
            fi
          done

          export SSHPASS="$SSH_PASS"
          printf '%s\n' "$GITHUB_SHA" > ./tools/dev/ks-editor/deploy-version.txt

          # Lolipop serves the configured "mokiss" upload folder from
          # $HOME/web/mokiss. Use rsync's one SSH session both to create the
          # destination and upload, avoiding repeated connections that the
          # shared SSH host can close with exit code 255.
          echo "Deploying to Lolipop upload folder: web/mokiss/dev/"
          DEPLOYED=false
          for attempt in 1 2 3; do
            if sshpass -e rsync -avz \
              --ignore-times \
              --timeout=60 \
              --exclude=api_config.php \
              --rsync-path='printf "remote_home=%s\\n" "$HOME" >&2; mkdir -p "$HOME/web/mokiss/dev" && exec rsync' \
              -e "ssh -p ${SSH_PORT:-2222} -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              ./tools/dev/ \
              "${SSH_USER}@${SSH_HOST}:web/mokiss/dev/"; then
              DEPLOYED=true
              break
            fi

            echo "::warning::SSH/rsync attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          if [ "$DEPLOYED" != true ]; then
            echo "::error::Lolipop closed all three SSH/rsync attempts"
            exit 1
          fi

      - name: Verify public deployment
        run: |
          # Static files are normally visible immediately. Retry briefly for a
          # transient edge cache, but do not hide a wrong document root for two minutes.
          PUBLIC_SHA=""
          for attempt in $(seq 1 5); do
            PUBLIC_SHA=$(curl --fail --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://mokiss.jp/dev/ks-editor/deploy-version.txt?deploy=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s%N)" || true)
            if [ "$PUBLIC_SHA" = "$GITHUB_SHA" ]; then
              echo "Public deployment verified: $PUBLIC_SHA"
              exit 0
            fi
            echo "Attempt ${attempt}: expected $GITHUB_SHA, got ${PUBLIC_SHA:-<empty>}"
            sleep 3
          done

          echo "::error::SSH upload succeeded, but mokiss.jp is serving ${PUBLIC_SHA:-<empty>} instead of $GITHUB_SHA"
          echo "::error::Expected Lolipop document root: \$HOME/web/mokiss (upload folder: mokiss)"
          exit 1
