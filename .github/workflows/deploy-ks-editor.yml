name: Deploy to Lolipop via SSH

on:
  push:
    branches:
      - main
    paths:
      - 'tools/dev/**'
      - '.github/workflows/deploy-ks-editor.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PASS: ${{ secrets.SSH_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass + rsync
        run: |
          timeout 5m sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends sshpass rsync

      - name: Find existing public web root
        run: |
          export SSHPASS="$SSH_PASS"
          sshpass -e ssh \
            -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            'printf "home=%s\\n" "$HOME"; printf "existing_editor_roots=\\n"; find "$HOME" -type f -path "*/dev/ks-editor/index.html" -exec dirname {} \; 2>/dev/null | sed "s#/dev/ks-editor$##" | head -10'

      - name: Deploy
        run: |
          export SSHPASS="$SSH_PASS"
          printf '%s\n' "$GITHUB_SHA" > ./tools/dev/ks-editor/deploy-version.txt

          # Deploy to every existing editor root. A shared host can contain several site roots.
          WEB_PATHS=$(sshpass -e ssh \
            -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            'find "$HOME" -type f -path "*/dev/ks-editor/index.html" -exec dirname {} \; 2>/dev/null | sed "s#/dev/ks-editor$##" | sort -u' 2>/dev/null)

          if [ -z "$WEB_PATHS" ]; then
            # First deployment fallback. Include every candidate that has a dev directory.
            WEB_PATHS=$(sshpass -e ssh \
              -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" \
              'for candidate in "$HOME/pikupikutai.pinoko.jp/mokiss" "$HOME/mokiss" "$HOME/pikupikutai.pinoko.jp"; do
                 if [ -d "$candidate/dev" ]; then printf "%s\\n" "$candidate"; fi
               done')
          fi

          if [ -z "$WEB_PATHS" ]; then
            echo "ERROR: Could not find the public web root on the SSH host"
            exit 1
          fi

          while IFS= read -r WEB_PATH; do
            [ -z "$WEB_PATH" ] && continue
            echo "Deploying to: ${WEB_PATH}/dev/"
            sshpass -e ssh \
              -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p \"${WEB_PATH}/dev/ks-editor\""

            sshpass -e rsync -avz \
              --ignore-times \
              --exclude=api_config.php \
              -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              ./tools/dev/ \
              "${SSH_USER}@${SSH_HOST}:${WEB_PATH}/dev/"

            REMOTE_SHA=$(sshpass -e ssh \
              -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" \
              "cat \"${WEB_PATH}/dev/ks-editor/deploy-version.txt\"")

            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "Remote deploy verification failed for ${WEB_PATH}: expected $GITHUB_SHA, got $REMOTE_SHA"
              exit 1
            fi
          done <<< "$WEB_PATHS"

      - name: Verify public deployment
        run: |
          # Shared hosting may need a short time before Apache serves the new file.
          for attempt in $(seq 1 20); do
            PUBLIC_SHA=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "https://mokiss.jp/dev/ks-editor/deploy-version.txt?deploy=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s%N)" || true)
            if [ "$PUBLIC_SHA" = "$GITHUB_SHA" ]; then
              echo "Public deployment verified: $PUBLIC_SHA"
              exit 0
            fi
            echo "Attempt ${attempt}: expected $GITHUB_SHA, got ${PUBLIC_SHA:-<empty>}"
            sleep 5
          done

          echo "Public deployment verification failed"
          exit 1
